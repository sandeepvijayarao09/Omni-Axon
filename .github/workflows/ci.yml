name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle contains no Gemini key
        env:
          GEMINI_API_KEY: ci-sentinel-not-a-real-key
        run: |
          npm run build
          if grep -rq "ci-sentinel-not-a-real-key" dist/; then
            echo "GEMINI_API_KEY leaked into the client bundle" && exit 1
          fi
